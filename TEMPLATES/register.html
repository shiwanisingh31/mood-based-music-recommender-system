{% extends "base.html" %}

{% block title %}Sign Up - Mood Music{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 2rem;">
    <div style="background: white; padding: 3rem; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); width: 100%; max-width: 450px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 2rem; margin-bottom: 0.5rem; color: #667eea;">Join Mood Music! 🎶</h1>
            <p style="color: #6b7280;">Create an account to save your musical journey</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Username</label>
                <input type="text" name="username" placeholder="Choose a username" required minlength="3"
                    style="width: 100%; padding: 0.9rem 1.2rem; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 1rem;">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Email</label>
                <input type="email" name="email" placeholder="Enter your email" required
                    style="width: 100%; padding: 0.9rem 1.2rem; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 1rem;">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Password</label>
                <input type="password" name="password" placeholder="Create a password (min 6 characters)" required minlength="6"
                    style="width: 100%; padding: 0.9rem 1.2rem; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 1rem;">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm your password" required minlength="6"
                    style="width: 100%; padding: 0.9rem 1.2rem; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 1rem;">
            </div>

            <button type="submit" style="width: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1rem; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer;">
                Create Account
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; color: #6b7280;">
            <p>Already have an account? <a href="{{ url_for('login') }}" style="color: #667eea; text-decoration: none; font-weight: 600;">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
