{% extends "base.html" %}

{% block title %}Login - Mood Music{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 2rem;">
    <div style="background: white; padding: 3rem; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); width: 100%; max-width: 450px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 2rem; margin-bottom: 0.5rem; color: #667eea;">Welcome Back! 🎵</h1>
            <p style="color: #6b7280;">Login to discover music that matches your mood</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Username</label>
                <input type="text" name="username" placeholder="Enter your username" required
                    style="width: 100%; padding: 0.9rem 1.2rem; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 1rem;">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.5rem;">Password</label>
                <input type="password" name="password" placeholder="Enter your password" required
                    style="width: 100%; padding: 0.9rem 1.2rem; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 1rem;">
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                    <input type="checkbox" name="remember" value="1">
                    <span>Remember me</span>
                </label>
            </div>

            <button type="submit" style="width: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 1rem; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer;">
                Login
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; color: #6b7280;">
            <p>Don't have an account? <a href="{{ url_for('register') }}" style="color: #667eea; text-decoration: none; font-weight: 600;">Sign up here</a></p>
        </div>
    </div>
</div>
{% endblock %}
